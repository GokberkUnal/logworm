spring:
  application:
    name: logworm
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logworm:
  demo-producer:
    enabled: true
    topic: demo-logs
  kafka:
    request-timeout: 5s
  stream:
    max-concurrent: 20
    default-rate: 100
    max-rate: 1000
    heartbeat: 15s
    lag-skip-factor: 10
